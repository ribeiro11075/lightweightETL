[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-etl"
version = "0.1.0"
description = "Move data between databases, across engines, with streaming and incremental loads"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "David Ribeiro" }]
dependencies = [
    "pyyaml==6.0.3",
    "pydantic==2.13.5",
    ]

[project.urls]
Homepage = "https://github.com/ribeiro11075/lightweight-etl"
Documentation = "https://github.com/ribeiro11075/lightweight-etl/tree/master/docs"
Issues = "https://github.com/ribeiro11075/lightweight-etl/issues"

[project.scripts]
lightweight-etl = "lightweight_etl.cli:main"

[project.optional-dependencies]
mysql = ["mysql-connector-python==26.7.0"]
postgresql = ["psycopg2==2.9.12"]
oracle = ["oracledb==4.0.2"]
mssql = ["pymssql==2.4.0"]
# MariaDB speaks MySQL's wire protocol, and MariaDBDialect reuses MySQLDialect's
# connect() wholesale -- same driver package, no separate extra needed
mariadb = ["mysql-connector-python==26.7.0"]
# sqlite3 is Python's standard library -- no extra to install at all, this exists
# only so `lightweight-etl[all]` and the pattern below stay uniform
sqlite = []
all = ["lightweight-etl[mysql,postgresql,oracle,mssql,mariadb,sqlite]"]
dev = ["pytest==9.1.1", "mypy==2.3.1", "types-PyYAML==6.0.12.20260815"]

[tool.setuptools]
packages = ["lightweight_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs a real database (e.g. `docker compose up -d mysql`); run explicitly with `pytest -m integration`",
    ]

[tool.mypy]
# mypy 2.x's minimum checkable target is 3.10; the package itself still
# supports and declares requires-python >=3.9 above -- nothing in the code
# actually uses 3.10+-only syntax, this is purely mypy's own tooling floor
python_version = "3.10"
files = ["lightweight_etl"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
