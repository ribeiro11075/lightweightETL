[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "understudy-data"
version = "0.1.0"
description = "Safe, realistic copies of production across databases: masking, subsets, synthetic data, and the ETL to move them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "David Ribeiro" }]
keywords = ["data masking", "test data", "anonymization", "pseudonymization", "database subsetting", "synthetic data", "etl",
            "format-preserving encryption", "oracle", "sql server", "postgresql", "mysql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
    ]
# Ranges, not pins: this installs beside other tools (Airflow, Dagster, dbt)
# that have their own. CI tests the lower bounds (constraints/lowest.txt) and
# one pinned set of newer versions (constraints/image.txt).
dependencies = [
    "pyyaml>=6.0.1,<7",
    "pydantic>=2.6,<3",
    ]

[project.urls]
Homepage = "https://github.com/ribeiro11075/understudy"
Documentation = "https://github.com/ribeiro11075/understudy/tree/master/docs"
Issues = "https://github.com/ribeiro11075/understudy/issues"

[project.scripts]
understudy = "understudy_data.cli:main"

[project.optional-dependencies]
mysql = ["mysql-connector-python>=8.4"]
postgresql = ["psycopg2>=2.9.6"]
oracle = ["oracledb>=2.5"]
mssql = ["pymssql>=2.3.5"]
# MariaDB speaks MySQL's wire protocol, and MariaDBDialect reuses MySQLDialect's
# connect() wholesale -- same driver package, no separate extra needed
mariadb = ["mysql-connector-python>=8.4"]
# sqlite3 is Python's standard library -- no extra to install at all, this exists
# only so `understudy-data[all]` and the pattern below stay uniform
sqlite = []
# The fpe masking strategy's AES; oracledb already depends on it
fpe = ["cryptography>=42"]
all = ["understudy-data[mysql,postgresql,oracle,mssql,mariadb,sqlite,fpe]"]
dev = ["pytest==9.1.1", "mypy==2.3.1", "types-PyYAML==6.0.12.20260815", "build==1.6.1", "twine==7.0.0"]

[tool.setuptools]
packages = ["understudy_data"]

[tool.setuptools.package-data]
understudy_data = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs a real database (e.g. `docker compose up -d mysql`); run explicitly with `pytest -m integration`",
    ]

[tool.mypy]
# The oldest Python the package supports (requires-python above), so mypy
# flags anything newer
python_version = "3.10"
files = ["understudy_data"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
