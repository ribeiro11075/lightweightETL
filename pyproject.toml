[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-etl"
version = "0.1.0"
description = "A lightweight python library to perform ETL (Extract, Transform, Load)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "David Ribeiro" }]
dependencies = [
    "pyyaml==6.0.3",
    "pydantic==2.13.5",
    ]

[project.optional-dependencies]
mysql = ["mysql-connector-python==26.7.0"]
postgresql = ["psycopg2==2.9.12"]
oracle = ["cx-Oracle==8.3.0"]
all = ["lightweight-etl[mysql,postgresql,oracle]"]
dev = ["pytest==9.1.1", "mypy==2.3.1", "types-PyYAML==6.0.12.20260815"]

[tool.setuptools]
packages = ["library"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# mypy 2.x's minimum checkable target is 3.10; the package itself still
# supports and declares requires-python >=3.9 above -- nothing in the code
# actually uses 3.10+-only syntax, this is purely mypy's own tooling floor
python_version = "3.10"
files = ["library"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
