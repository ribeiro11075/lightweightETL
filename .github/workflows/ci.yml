name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests, Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,fpe]"
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest -q

  integration:
    name: Integration tests against real databases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Start the databases
        run: docker compose up -d --wait --wait-timeout 600
      - name: Install
        # psycopg2-binary rather than the extra's psycopg2, which needs
        # PostgreSQL's build tools; the tests exercise the same driver.
        run: python -m pip install -e ".[mysql,oracle,mssql,fpe,dev]" psycopg2-binary
      - name: Test
        run: pytest -q -m integration
      - name: Database logs
        if: failure()
        run: docker compose logs --tail 200
