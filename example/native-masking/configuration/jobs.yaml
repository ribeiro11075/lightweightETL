# The narrow job demo.py runs in Python and in Rust: six masked columns, whose
# strategies the native masker all covers, fakeName included.
workers: 1
jobs:
  maskCustomers:
    active: true
    sourceDatabase: production
    sourceQuery: select id, email, phone, national_id, token, full_name from customers
    targetDatabase: staging
    targetTableFinal: customers
    insertStrategy: upsert
    chunkSize: 5000
    masking:
      key: ${MASKING_KEY}
      columns:
        id:          key
        email:       email
        phone:       digits
        national_id: { strategy: key, charset: digits }
        token:       { strategy: hash, prefix: tok_ }
        full_name:   fakeName
